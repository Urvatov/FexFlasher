name: Build and Release FexFlasher

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore FexFlasher.csproj

      - name: Publish (Self-Contained Single-File)
        run: >
          dotnet publish FexFlasher.csproj
          -c Release
          -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o published

      - name: Create Release Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "FexFlasher-$version-win-x64.zip"

          New-Item -ItemType Directory -Path "release_pkg\files" -Force
          Copy-Item "published\FexFlasher.exe" -Destination "release_pkg\"
          if (Test-Path "files\boot_package.fex") {
            Copy-Item "files\boot_package.fex" -Destination "release_pkg\files\"
          }
          Copy-Item "README.md" -Destination "release_pkg\"
          Copy-Item "LICENSE" -Destination "release_pkg\"

          Compress-Archive -Path "release_pkg\*" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: FexFlasher-${{ github.ref_name }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
